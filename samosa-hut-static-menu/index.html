<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080908">
  <meta name="description" content="Explore Samosa Hut's signature samosas, fusion street food, sides, drinks and daily specials.">
  <title>Samosa Hut Digital Menu</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main id="app" class="menu-app">
    <section id="cover" class="cover" aria-label="Samosa Hut menu cover">
      <div class="cover-board">
        <div class="cover-rule" aria-hidden="true"></div>

        <div class="cover-brand optional-image" data-optional-image>
          <img src="images/logo.png" alt="Samosa Hut" data-image>
          <div class="cover-brand-fallback" data-fallback>
            <span>Samosa</span>
            <b>Hut</b>
          </div>
        </div>

        <div class="cover-copy">
          <p class="cover-kicker">Ajax · Ontario</p>
          <h1>Digital <span>Menu</span></h1>
          <p>Fusion street food &amp; signature samosas</p>
        </div>

        <button id="open-menu" class="open-button" type="button" disabled>
          <span>Open menu</span><b aria-hidden="true">→</b>
        </button>

        <div class="cover-rule" aria-hidden="true"></div>
      </div>
    </section>

    <div id="book-shell" class="book-shell" aria-hidden="true">
      <header class="topbar">
        <button id="brand-button" class="brand-button" type="button" aria-label="Return to the Samosa Hut menu cover">
          <span class="header-icon optional-image" data-optional-image aria-hidden="true">
            <img src="images/logo.png" alt="" data-image>
            <span class="header-icon-fallback" data-fallback>SH</span>
          </span>
          <span class="brand-copy optional-image" data-optional-image>
            <img class="brand-wordmark" src="images/wordmark.png" alt="Samosa Hut" data-image>
            <b class="brand-wordmark-fallback" data-fallback>Samosa Hut</b>
            <small>Digital menu</small>
          </span>
        </button>

        <div class="topbar-actions">
          <button id="search-trigger" class="search-trigger" type="button" aria-label="Search the menu">⌕</button>
          <div id="page-count" class="page-count" aria-live="polite">Menu</div>
        </div>
      </header>

      <section id="page-stage" class="page-stage" aria-live="polite"></section>

      <nav class="bottom-nav" aria-label="Menu navigation">
        <button id="previous-button" type="button" disabled>
          <span aria-hidden="true">←</span><small>Previous</small>
        </button>
        <button id="categories-button" type="button" class="active">
          <span aria-hidden="true">☷</span><small>Categories</small>
        </button>
        <button id="next-button" type="button" disabled>
          <span aria-hidden="true">→</span><small>Next</small>
        </button>
      </nav>
    </div>

    <section id="search-overlay" class="search-overlay" role="dialog" aria-modal="true" aria-label="Search the menu" aria-hidden="true">
      <div class="search-panel">
        <div class="search-header">
          <div><p>Find a favourite</p><h2>Search the menu</h2></div>
          <button id="search-close" type="button" aria-label="Close search">×</button>
        </div>

        <label class="search-field">
          <span class="sr-only">Search dishes and flavours</span>
          <b aria-hidden="true">⌕</b>
          <input id="search-input" type="search" placeholder="Try “butter chicken” or “mango”…" autocomplete="off">
        </label>

        <div id="search-results" class="search-results" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <noscript>This digital menu requires JavaScript to display its categories.</noscript>
</body>
</html>
